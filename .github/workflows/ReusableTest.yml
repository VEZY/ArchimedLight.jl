name: Reusable test

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: "1"
      os:
        required: false
        type: string
        default: ubuntu-latest
      allow_failure:
        required: false
        type: boolean
        default: false
      run_codecov:
        required: false
        type: boolean
        default: false
    secrets:
      codecov_token:
        required: true

jobs:
  test:
    name: Julia ${{ inputs.version }} - ${{ inputs.os }} - ${{ github.event_name }}
    runs-on: ${{ inputs.os }}
    continue-on-error: ${{ inputs.allow_failure }}

    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ inputs.version }}
      - name: Use Julia cache
        uses: julia-actions/cache@v3
      - name: Resolve pinned PlantGeom and PlantSimEngine revisions
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.add([
              PackageSpec(url="https://github.com/VEZY/PlantGeom.jl", rev="dc8df0e30b80d68dec876c752575386ffa324b8d"),
              PackageSpec(url="https://github.com/VirtualPlantLab/PlantSimEngine.jl", rev="bb3ceea306fb0bc0fb3a569f36c0d96aa929327c"),
            ])'
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
        if: ${{ inputs.run_codecov }}
      - uses: codecov/codecov-action@v7
        if: ${{ inputs.run_codecov }}
        with:
          file: lcov.info
          token: ${{ secrets.codecov_token }}
