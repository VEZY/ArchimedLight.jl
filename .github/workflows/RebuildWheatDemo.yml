name: Rebuild wheat browser demo

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/RebuildWheatDemo.yml"
      - "docs/live_wheat/**"
      - "src/**"
      - "ext/**"
      - "Project.toml"
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  rebuild:
    name: Compile and verify wheat WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The caller's revision is used, including the exact tag for releases.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13.1"
      - name: Instantiate the pinned compiler environment
        run: julia --startup-file=no --project=docs/live_wheat -e 'using Pkg; Pkg.instantiate()'
      - name: Compile from source and export the browser demo
        run: julia --startup-file=no --project=docs/live_wheat docs/live_wheat/build.jl
      - name: Verify the rebuilt browser calculations
        run: node docs/live_wheat/check_wasm.mjs --current-native
      - name: Prepare the verified artifact and its build provenance
        run: |
          mkdir -p "$RUNNER_TEMP/wheat-demo/docs/src/assets/live-wheat"
          mkdir -p "$RUNNER_TEMP/wheat-demo/docs/live_wheat/build"
          cp docs/src/assets/live-wheat/index.html docs/src/assets/live-wheat/light.wasm "$RUNNER_TEMP/wheat-demo/docs/src/assets/live-wheat/"
          cp docs/live_wheat/artifact_receipt.json docs/live_wheat/Manifest.toml "$RUNNER_TEMP/wheat-demo/docs/live_wheat/"
          cp docs/live_wheat/build/*.json "$RUNNER_TEMP/wheat-demo/docs/live_wheat/build/"
      - name: Retain verified assets, resolved dependencies and numerical checks
        uses: actions/upload-artifact@v7
        with:
          name: wheat-browser-demo
          path: ${{ runner.temp }}/wheat-demo/
          if-no-files-found: error
          retention-days: 90
