name: Historical regression comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Regression / ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: main-before-migration
            ref: 53a26266454e1e05d4f954c771d32b7e74afccc7
          - label: original-pr51
            ref: 769ae760828c6eac8f4ca20def82362277e270fc
          - label: registered-dependencies
            ref: ff0c306224daf35c450f701b94f093c32aa24785
    env:
      JULIA_NUM_THREADS: "1"
      ARCHIMEDLIGHT_REGRESSION_PROFILE: fast
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13.0"
      - name: Prepare original declared environment
        timeout-minutes: 20
        shell: julia --project=test --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
          Pkg.status(; mode=Pkg.PKGMODE_MANIFEST)
      - name: Record exact provenance
        if: always()
        run: |
          mkdir -p regression-comparison-evidence
          git rev-parse HEAD > regression-comparison-evidence/commit.txt
          git status --short > regression-comparison-evidence/environment-changes.txt
          julia --version > regression-comparison-evidence/julia-version.txt
          uname -a > regression-comparison-evidence/platform.txt
          cp Project.toml regression-comparison-evidence/package-Project.toml
          cp test/Project.toml regression-comparison-evidence/test-Project.toml
          if test -f test/Manifest.toml; then
            cp test/Manifest.toml regression-comparison-evidence/Manifest.toml
          fi
          git ls-tree -r HEAD src ext test/regression_matrix test/fast_fixtures > regression-comparison-evidence/source-and-fixtures.txt
      - name: Verify report status correction
        if: matrix.label == 'registered-dependencies'
        timeout-minutes: 10
        shell: julia --project=test --color=yes {0}
        run: |
          using TestItemRunner
          TestItemRunner.run_tests(pwd(); filter=ti -> ti.name == "Regression reports distinguish drift from strict failure", verbose=true)
      - name: Execute unchanged fast regression matrix
        timeout-minutes: 10
        run: julia --project=test --color=yes test/regression_matrix/runtests.jl
      - name: Upload observations and provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-comparison-${{ matrix.label }}
          path: |
            regression-comparison-evidence
            test/regression_matrix/reports/latest
          if-no-files-found: error
