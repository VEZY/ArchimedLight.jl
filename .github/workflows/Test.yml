name: Regression comparator coverage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JULIA_NUM_THREADS: "1"
      ARCHIMEDLIGHT_REGRESSION_PROFILE: fast
    steps:
      - uses: actions/checkout@v7
        with:
          ref: d16a6f73a73f15a1eb4207699651f171245da72b
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13.0"
      - name: Prepare registered dependency environment
        timeout-minutes: 20
        shell: julia --project=test --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
          Pkg.status(; mode=Pkg.PKGMODE_MANIFEST)
      - name: Verify comparator and status edge cases
        timeout-minutes: 10
        shell: julia --project=test --color=yes {0}
        run: |
          using TestItemRunner
          TestItemRunner.run_tests(pwd(); filter=ti -> occursin("Regression", ti.name), verbose=true)
      - name: Run all 100 fast regression cases
        timeout-minutes: 10
        run: julia --project=test --color=yes test/regression_matrix/runtests.jl
      - name: Record exact provenance
        if: always()
        run: |
          mkdir -p regression-coverage-evidence
          git rev-parse HEAD > regression-coverage-evidence/commit.txt
          git status --short > regression-coverage-evidence/environment-changes.txt
          julia --version > regression-coverage-evidence/julia-version.txt
          uname -a > regression-coverage-evidence/platform.txt
          cp Project.toml regression-coverage-evidence/package-Project.toml
          cp test/Project.toml regression-coverage-evidence/test-Project.toml
          if test -f test/Manifest.toml; then
            cp test/Manifest.toml regression-coverage-evidence/Manifest.toml
          fi
          git ls-tree -r HEAD src ext test/regression_matrix test/fast_fixtures > regression-coverage-evidence/source-and-fixtures.txt
      - name: Upload observations and provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-comparator-coverage
          path: |
            regression-coverage-evidence
            test/regression_matrix/reports/latest
          if-no-files-found: error
